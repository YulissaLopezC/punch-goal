<!DOCTYPE html>
<html lang="es" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Punch Goal</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface":                    "#f8f9ff",
            "surface-dim":                "#cbdbf5",
            "surface-bright":             "#f8f9ff",
            "surface-container-lowest":   "#ffffff",
            "surface-container-low":      "#eff4ff",
            "surface-container":          "#e5eeff",
            "surface-container-high":     "#dce9ff",
            "surface-container-highest":  "#d3e4fe",
            "on-surface":                 "#0b1c30",
            "on-surface-variant":         "#464554",
            "inverse-surface":            "#213145",
            "inverse-on-surface":         "#eaf1ff",
            "outline":                    "#767586",
            "outline-variant":            "#c7c4d7",
            "primary":                    "#4648d4",
            "on-primary":                 "#ffffff",
            "primary-container":          "#6063ee",
            "on-primary-container":       "#fffbff",
            "primary-fixed":              "#e1e0ff",
            "primary-fixed-dim":          "#c0c1ff",
            "on-primary-fixed":           "#07006c",
            "on-primary-fixed-variant":   "#2f2ebe",
            "inverse-primary":            "#c0c1ff",
            "secondary":                  "#006c49",
            "on-secondary":               "#ffffff",
            "secondary-container":        "#6cf8bb",
            "on-secondary-container":     "#00714d",
            "secondary-fixed":            "#6ffbbe",
            "secondary-fixed-dim":        "#4edea3",
            "on-secondary-fixed":         "#002113",
            "on-secondary-fixed-variant": "#005236",
            "tertiary":                   "#825100",
            "on-tertiary":                "#ffffff",
            "tertiary-container":         "#a36700",
            "on-tertiary-container":      "#fffbff",
            "tertiary-fixed":             "#ffddb8",
            "tertiary-fixed-dim":         "#ffb95f",
            "on-tertiary-fixed":          "#2a1700",
            "on-tertiary-fixed-variant":  "#653e00",
            "error":                      "#ba1a1a",
            "on-error":                   "#ffffff",
            "error-container":            "#ffdad6",
            "on-error-container":         "#93000a",
            "background":                 "#f8f9ff",
            "on-background":              "#0b1c30",
            "surface-tint":               "#494bd6",
            "surface-variant":            "#d3e4fe"
          },
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"]
          },
          fontSize: {
            "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }],
            "headline-md": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "700" }],
            "headline-sm": ["20px", { lineHeight: "28px", fontWeight: "600" }],
            "body-lg":     ["18px", { lineHeight: "28px", fontWeight: "400" }],
            "body-md":     ["16px", { lineHeight: "24px", fontWeight: "400" }],
            "body-sm":     ["14px", { lineHeight: "20px", fontWeight: "400" }],
            "label-md":    ["14px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" }],
            "label-sm":    ["12px", { lineHeight: "16px", fontWeight: "500" }]
          }
        }
      }
    }
  </script>
</head>

<body class="bg-surface text-on-surface font-sans selection:bg-primary-fixed selection:text-on-primary-fixed">

<!-- ═══════════════════════════════════════════════════════════════════════════
     LOGIN SCREEN
════════════════════════════════════════════════════════════════════════════ -->
<div id="login-screen" class="min-h-dvh flex flex-col items-center justify-center px-6 gap-8">
  <div class="text-center">
    <p class="text-6xl mb-4">🥊</p>
    <h1 class="text-headline-lg text-primary font-bold">Punch Goal</h1>
    <p class="text-body-md text-on-surface-variant mt-2">Retos personales con punch cards digitales</p>
  </div>

  <button id="btn-login"
    class="flex items-center gap-3 bg-surface-container-lowest border border-outline-variant rounded-full px-6 py-3 font-label-md text-label-md text-on-surface hover:bg-surface-container transition-colors shadow-sm active:scale-95 duration-150">
    <svg width="20" height="20" viewBox="0 0 48 48" class="shrink-0">
      <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.2l6.8-6.8C35.8 2.5 30.2 0 24 0 14.7 0 6.7 5.4 2.7 13.3l7.9 6.1C12.5 13.1 17.8 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17z"/>
      <path fill="#FBBC05" d="M10.6 28.6A14.8 14.8 0 0 1 9.5 24c0-1.6.3-3.1.7-4.6L2.4 13.3A23.9 23.9 0 0 0 0 24c0 3.8.9 7.4 2.5 10.6l8.1-6z"/>
      <path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.2 0-11.5-3.6-13.4-8.8l-7.9 6.1C6.7 42.6 14.7 48 24 48z"/>
    </svg>
    Continuar con Google
  </button>

  <p class="text-label-sm text-on-surface-variant text-center max-w-xs">
    Tus retos se guardan en la nube y están disponibles en cualquier dispositivo.
  </p>
</div>


<!-- ═══════════════════════════════════════════════════════════════════════════
     APP SCREEN
════════════════════════════════════════════════════════════════════════════ -->
<div id="app-screen" class="hidden min-h-dvh flex flex-col">

  <!-- Header -->
  <header class="bg-surface sticky top-0 z-40 border-b border-outline-variant shadow-sm">
    <div class="max-w-2xl mx-auto px-5 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🥊</span>
        <span class="text-headline-sm text-primary font-bold">Punch Goal</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="btn-nuevo-reto"
          class="bg-primary text-on-primary px-4 py-2 rounded-full text-label-md font-semibold hover:opacity-90 active:scale-95 duration-150 transition-all flex items-center gap-1.5">
          <span class="material-symbols-outlined text-[18px]" style="font-variation-settings:'FILL' 1">add</span>
          Nuevo reto
        </button>
        <!-- User menu dropdown -->
        <div class="relative">
          <button id="btn-user-menu"
            class="flex items-center gap-2 pl-1 pr-2 py-1 rounded-full hover:bg-surface-container transition-colors">
            <img id="user-photo" src="" alt="avatar" class="hidden h-8 w-8 rounded-full object-cover border border-outline-variant" />
            <span id="user-name" class="text-body-sm text-on-surface-variant hidden sm:inline"></span>
            <span class="material-symbols-outlined text-[18px] text-on-surface-variant">expand_more</span>
          </button>
          <div id="user-dropdown"
            class="hidden absolute right-0 top-full mt-2 w-56 bg-surface-container-lowest border border-outline-variant rounded-xl shadow-lg overflow-hidden z-50">
            <div class="px-4 py-3 border-b border-outline-variant">
              <p id="user-email" class="text-label-sm text-on-surface-variant truncate"></p>
            </div>
            <button id="btn-signout"
              class="w-full flex items-center gap-3 px-4 py-3 text-body-sm text-on-surface hover:bg-surface-container transition-colors">
              <span class="material-symbols-outlined text-[18px]">logout</span>
              Cerrar sesión
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 max-w-2xl mx-auto w-full px-5 pt-6 pb-10">

    <!-- Tabs -->
    <div class="flex gap-6 border-b border-outline-variant mb-6 px-1">
      <button id="tab-activos"
        class="pb-3 text-primary border-b-2 border-primary font-bold text-label-md">
        Activos
      </button>
      <button id="tab-completados"
        class="pb-3 text-on-surface-variant font-medium text-label-md">
        Completados
      </button>
    </div>

    <!-- Panel: Activos -->
    <div id="panel-activos">
      <div id="retos-activos" class="flex flex-col gap-4"></div>
    </div>

    <!-- Panel: Completados -->
    <div id="panel-completados" class="hidden">
      <div id="retos-completados" class="flex flex-col gap-4"></div>
    </div>

  </main>
</div>


<!-- ═══════════════════════════════════════════════════════════════════════════
     MODAL: CREAR RETO
════════════════════════════════════════════════════════════════════════════ -->
<div id="modal-crear"
  class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
  <div class="bg-surface-container-lowest rounded-2xl w-full max-w-md shadow-xl">
    <div class="flex justify-between items-center px-6 pt-5 pb-4 border-b border-outline-variant">
      <h2 class="text-headline-sm font-bold">Nuevo reto</h2>
      <button id="btn-cerrar-crear" class="text-on-surface-variant hover:text-on-surface transition-colors p-1 rounded-lg">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <form id="form-crear-reto" class="px-6 py-5 flex flex-col gap-4">

      <div>
        <label class="block text-label-md text-on-surface-variant mb-1.5">Nombre del reto</label>
        <input id="input-nombre" type="text" placeholder="Ej: Leer 30 minutos"
          required maxlength="60"
          class="w-full bg-surface-container border border-outline-variant rounded-xl px-4 py-3 text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition" />
      </div>

      <div class="flex gap-3">
        <div class="flex-1">
          <label class="block text-label-md text-on-surface-variant mb-1.5">Emoji del hueco</label>
          <input id="input-emoji" type="text" placeholder="📚"
            required maxlength="4"
            class="w-full bg-surface-container border border-outline-variant rounded-xl px-4 py-3 text-body-md text-center text-2xl focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition" />
        </div>
        <div class="flex-1">
          <label class="block text-label-md text-on-surface-variant mb-1.5">Número de huecos</label>
          <input id="input-huecos" type="number" placeholder="30"
            required min="1" max="100"
            class="w-full bg-surface-container border border-outline-variant rounded-xl px-4 py-3 text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition" />
        </div>
      </div>

      <div>
        <label class="block text-label-md text-on-surface-variant mb-1.5">Premio al completarlo</label>
        <input id="input-premio" type="text" placeholder="Ej: Un día de spa"
          required maxlength="120"
          class="w-full bg-surface-container border border-outline-variant rounded-xl px-4 py-3 text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition" />
      </div>

      <button id="btn-guardar-reto" type="submit"
        class="w-full bg-primary text-on-primary font-bold text-label-md py-3 rounded-xl hover:opacity-90 active:scale-95 transition-all duration-150 disabled:opacity-50 disabled:cursor-not-allowed mt-1">
        Crear reto
      </button>

    </form>
  </div>
</div>


<!-- ═══════════════════════════════════════════════════════════════════════════
     MODAL: CONFIRMAR HUECO
════════════════════════════════════════════════════════════════════════════ -->
<div id="modal-confirmar"
  class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-6">
  <div class="bg-surface-container-lowest rounded-2xl w-full max-w-sm shadow-xl p-6 flex flex-col items-center gap-5 text-center">
    <span id="confirmar-emoji" class="text-5xl"></span>
    <div>
      <p class="text-body-lg font-semibold text-on-surface">¿Cumpliste con</p>
      <p id="confirmar-nombre" class="text-headline-sm text-primary font-bold"></p>
      <p class="text-body-sm text-on-surface-variant mt-1">hoy?</p>
    </div>
    <div class="flex gap-3 w-full">
      <button id="btn-confirmar-no"
        class="flex-1 bg-surface-container text-on-surface font-semibold text-label-md py-3 rounded-xl hover:bg-surface-container-high active:scale-95 transition-all duration-150">
        No todavía
      </button>
      <button id="btn-confirmar-si"
        class="flex-1 bg-primary text-on-primary font-bold text-label-md py-3 rounded-xl hover:opacity-90 active:scale-95 transition-all duration-150">
        ¡Sí, lo hice! 🎉
      </button>
    </div>
  </div>
</div>


<!-- ═══════════════════════════════════════════════════════════════════════════
     MODAL: CELEBRACIÓN (flip card)
════════════════════════════════════════════════════════════════════════════ -->
<div id="modal-celebracion"
  class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-6">
  <div class="flex flex-col items-center gap-6 w-full max-w-sm">

    <!-- Flip card -->
    <div class="w-full h-52" style="perspective: 1000px">
      <div id="flip-card-inner" class="flip-card-inner">
        <!-- Front -->
        <div class="flip-card-front bg-surface-container-lowest border border-outline-variant flex flex-col items-center justify-center gap-3 p-6 rounded-xl">
          <span id="flip-front-emoji" class="text-6xl"></span>
          <p id="celebracion-nombre" class="text-headline-sm font-bold text-on-surface text-center"></p>
        </div>
        <!-- Back -->
        <div class="flip-card-back bg-secondary-container flex flex-col items-center justify-center gap-3 p-6 rounded-xl">
          <p class="text-headline-sm font-bold text-on-secondary-container">🎉 ¡Reto completado!</p>
          <span id="flip-back-emoji" class="text-5xl"></span>
          <div class="text-center">
            <p class="text-label-sm text-on-secondary-fixed-variant uppercase tracking-wide mb-1">Tu premio</p>
            <p id="celebracion-premio" class="text-body-md font-semibold text-on-secondary-container"></p>
          </div>
        </div>
      </div>
    </div>

    <button id="btn-cerrar-celebracion"
      class="bg-surface-container-lowest text-on-surface font-bold text-label-md px-8 py-3 rounded-full shadow hover:bg-surface-container active:scale-95 transition-all duration-150">
      Ver mis logros →
    </button>
  </div>
</div>


<script type="module" src="ui.js"></script>
</body>
</html>
